[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignforge-backend"
version = "1.0.0"
description = "AlignForge backend: active-learning annotation queue, LLM-as-a-Judge calibration, and DPO training."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Munir (master72o)" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
# Unified access to OpenAI / Anthropic / vLLM / Ollama for the judge and candidate generator.
llm = ["litellm>=1.40"]
# Local inference, embeddings and DPO training (Qwen2.5-0.5B-Instruct by default).
ml = [
  "torch>=2.2",
  "transformers>=4.45",
  "trl>=0.12",
  "peft>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "sentence-transformers>=3.0",
]
# 4-bit QLoRA (CUDA on Linux only).
qlora = ["bitsandbytes>=0.43; sys_platform == 'linux'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
